<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="selection-noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.88" numOctaves="4" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
  </defs>
  <rect width="128" height="128" fill="hsl(195, 100%, 46%)" />
  <rect width="128" height="128" filter="url(#selection-noise)" opacity="0.42" />
  <rect width="128" height="128" fill="hsl(196, 100%, 68%)" opacity="0.12" filter="url(#selection-noise)" />
</svg>
